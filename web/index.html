<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B4332">
<title>Parallax</title>
<link rel="stylesheet" href="/web/fontes-inter/inter.css">
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<header class="topo">
  <div class="marca">
    <span class="logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
    </span>
    <div><b>Parallax</b><small>Cooperativa piloto, soja e milho</small></div>
  </div>
  <div class="sessao" id="sessao" hidden>
    <span id="quem"></span>
    <span class="banco" id="banco" title="Conexão com o banco"></span>
    <button class="botao fantasma" id="sair">Sair</button>
  </div>
</header>

<main id="tela" aria-live="polite"></main>

<template id="t-login">
  <section class="cartao login">
    <h1>Entrar</h1>
    <p class="apoio">Cada papel vê a sua parte do ciclo: o produtor manda a foto, o gestor libera a rota, o técnico registra o laudo.</p>
    <form id="form-login">
      <label>Usuário <input name="login" autocomplete="username" required placeholder="gestor, tecnico1 ou produtor"></label>
      <label>Senha <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="botao" type="submit">Entrar</button>
      <p class="erro" id="erro-login" role="alert"></p>
    </form>
  </section>
</template>

<template id="t-produtor">
  <section class="coluna-celular">
    <div class="cartao">
      <h1>Mandar foto da folha</h1>
      <form id="form-foto">
        <label>Talhão <select name="plot_id" id="talhao" required></select></label>
        <label class="camera">
          <input type="file" name="photo" id="foto" accept="image/*" capture="environment" required>
          <span class="camera-botao">Tirar foto ou escolher da galeria</span>
        </label>
        <div class="previa" id="previa" hidden>
          <img id="previa-img" alt="Foto escolhida">
          <p id="estimativa"></p>
        </div>
        <label>O que você está vendo? <select name="suspected_pest" id="praga-suspeita"></select></label>
        <button class="botao" type="submit" id="enviar-foto">Enviar foto</button>
      </form>
      <div class="fila" id="fila" data-n="0">
        <span class="contador" id="contador">0</span>
        <span id="fila-texto">Nenhuma foto esperando sinal.</span>
      </div>
    </div>
    <div class="cartao">
      <h2>Fotos enviadas</h2>
      <ul class="lista" id="minhas-fotos"></ul>
    </div>
    <div class="cartao">
      <h2>Resposta da assistência técnica</h2>
      <ul class="lista" id="retornos"></ul>
    </div>
  </section>
</template>

<template id="t-gestor">
  <section class="painel">
    <div class="cabecalho-painel">
      <div>
        <h1 id="titulo-rota">Rota da semana</h1>
        <p class="apoio" id="apoio-rota"></p>
      </div>
      <div class="filtros">
        <label>Cultura <select id="cultura"></select></label>
        <label class="chave"><input type="checkbox" id="previa-semana"> Prévia da próxima rota</label>
      </div>
    </div>
    <div class="indicadores" id="indicadores"></div>
    <div class="grade-gestor">
      <div class="cartao">
        <div class="linha-titulo">
          <h2>Ordem de visita</h2>
          <button class="botao" id="liberar">Liberar rota</button>
        </div>
        <p class="aviso" id="aviso-rota" role="status"></p>
        <p class="apoio">A ordem vem do banco (severidade × confiança da amostra + variação na semana). Arraste ou use as setas para mudar antes de liberar.</p>
        <ol class="rota" id="rota"></ol>
      </div>
      <div class="cartao">
        <h2>Laudo × modelo</h2>
        <div id="concordancia"></div>
        <h3>Últimos laudos</h3>
        <ul class="lista" id="laudos-recentes"></ul>
      </div>
    </div>
  </section>
</template>

<template id="t-tecnico">
  <section class="coluna-celular">
    <div class="cartao">
      <h1>Rota liberada</h1>
      <p class="apoio" id="apoio-visitas"></p>
    </div>
    <ol class="visitas" id="visitas"></ol>
  </section>
</template>

<script src="/web/app.js"></script>
</body>
</html>
